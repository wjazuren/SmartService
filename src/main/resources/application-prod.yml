spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartservice}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:smartservice}
    password: ${MYSQL_PASSWORD:smartservice}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

smartservice:
  jwt:
    secret: ${JWT_SECRET}
