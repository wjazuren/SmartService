spring:
  application:
    name: smartservice
  datasource:
    url: jdbc:h2:mem:smartservice;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  mvc:
    async:
      request-timeout: 30s
  jackson:
    default-property-inclusion: non_null
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${AI_API_KEY:disabled}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.1

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

smartservice:
  jwt:
    secret: ${JWT_SECRET:smartservice-local-development-secret-2027}
    ttl: 8h
  confirmation:
    ttl: 5m
  agent:
    stream-delay-ms: 90
    ai:
      enabled: ${SMARTSERVICE_AI_ENABLED:false}
      model: ${AI_MODEL:deepseek-chat}
      timeout: 20s

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
